<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Purchase Order Tracking Splash</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:transparent}
a{color:#8C6A22}a:hover{color:#5E4715}
.po-stage{animation:po-exit .8s cubic-bezier(.7,0,.84,0) 4.5s forwards}
.po-card{opacity:0;transform:translateY(20px) scale(.94);filter:blur(6px);animation:po-in .9s cubic-bezier(.16,1,.3,1) .1s forwards}
.po-sk{transform:scaleX(0);transform-origin:0 50%;animation:po-sx .6s cubic-bezier(.16,1,.3,1) forwards}
.po-rtl .po-sk{transform-origin:100% 50%}
.po-stamp{transform:scale(0) rotate(-30deg);animation:po-stamp .55s cubic-bezier(.34,1.56,.64,1) 2.95s forwards}
.po-title{clip-path:inset(0 100% 0 0);background-size:300% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:po-wipe 1s cubic-bezier(.16,1,.3,1) .45s forwards,po-shine 1.3s cubic-bezier(.45,0,.55,1) 3.05s forwards}
.po-rtl .po-title{clip-path:inset(0 0 0 100%)}
.po-ch{display:inline-block;opacity:0;transform:translateY(8px);filter:blur(3px);animation:po-ch .55s cubic-bezier(.16,1,.3,1) forwards}
.po-fade{opacity:0;transform:translateY(8px);animation:po-up .8s cubic-bezier(.16,1,.3,1) forwards}
.po-pipe{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));width:min(860px,100%)}
.po-node{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:10px;opacity:0;transform:translateY(10px);animation:po-up .6s cubic-bezier(.16,1,.3,1) forwards}
.po-dot{position:relative;width:44px;height:44px;flex:none;border-radius:50%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.po-on{position:absolute;inset:-1.5px;border-radius:50%;display:flex;align-items:center;justify-content:center;transform:scale(0);animation:po-pop .45s cubic-bezier(.34,1.56,.64,1) forwards}
.po-ring{position:absolute;inset:-1.5px;border-radius:50%;opacity:0;animation:po-ring .9s ease-out forwards}
.po-check{stroke-dasharray:100;stroke-dashoffset:100;animation:po-draw .35s ease-out forwards}
.po-track{position:absolute;left:calc(100% / 12);right:calc(100% / 12);top:21px;height:2px;border-radius:1px;opacity:0;animation:po-fadein .5s ease-out .55s forwards}
.po-fill{position:absolute;inset:0;border-radius:1px;transform:scaleX(0);transform-origin:0 50%;animation:po-fx 1.65s linear 1s forwards}
.po-rtl .po-fill{transform-origin:100% 50%}
.po-label{font-size:13px;font-weight:500;white-space:nowrap}
.po-progress{transform:scaleX(0);transform-origin:0 50%;animation:po-fx 3.9s cubic-bezier(.5,0,.2,1) .1s forwards}
.po-rtl .po-progress{transform-origin:100% 50%}
.po-beam{opacity:0;transform:translateX(-62vw) rotate(18deg);filter:blur(10px);animation:po-beam 1.5s cubic-bezier(.45,0,.25,1) 2.9s forwards}
.po-spark{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(0);animation:po-tw 1.1s ease-in-out forwards}
@keyframes po-in{to{opacity:1;transform:none;filter:blur(0)}}
@keyframes po-sx{to{transform:scaleX(1)}}
@keyframes po-stamp{to{transform:scale(1) rotate(0)}}
@keyframes po-wipe{to{clip-path:inset(0 0 0 0)}}
@keyframes po-shine{from{background-position:100% 0}to{background-position:0 0}}
@keyframes po-ch{to{opacity:1;transform:none;filter:blur(0)}}
@keyframes po-up{to{opacity:1;transform:none}}
@keyframes po-fadein{to{opacity:1}}
@keyframes po-pop{to{transform:scale(1)}}
@keyframes po-ring{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.7)}}
@keyframes po-draw{to{stroke-dashoffset:0}}
@keyframes po-fx{to{transform:scaleX(1)}}
@keyframes po-fy{to{transform:scaleY(1)}}
@keyframes po-beam{0%{opacity:0;transform:translateX(-62vw) rotate(18deg)}20%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translateX(62vw) rotate(18deg)}}
@keyframes po-tw{0%{opacity:0;transform:scale(0) rotate(0)}45%{opacity:1;transform:scale(1) rotate(45deg)}100%{opacity:0;transform:scale(0) rotate(90deg)}}
@keyframes po-exit{to{opacity:0;transform:translateY(-14px);filter:blur(6px)}}
@media (max-width: 640px){
.po-pipe{grid-template-columns:minmax(0,1fr);width:200px}
.po-node{flex-direction:row;height:52px;gap:14px}
.po-track{left:21px;right:auto;top:26px;bottom:26px;width:2px;height:auto}
.po-rtl .po-track{left:auto;right:21px}
.po-fill{transform:scaleY(0);transform-origin:50% 0;animation-name:po-fy}
.po-rtl .po-fill{transform-origin:50% 0}
.po-label{font-size:14px}
}
@media (prefers-reduced-motion: reduce){
.po-stage *{animation-duration:.01s!important;animation-delay:0s!important}
.po-beam,.po-spark,.po-ring{display:none}
}
</style>
</helmet>
<div class="{{rootClass}}" dir="{{dir}}" style="position: relative; width: 100%; height: 100vh; min-height: 640px; overflow: hidden; background: {{backdrop}}; font-family: {{bodyFont}}">
<sc-if value="{{show}}" hint-placeholder-val="{{ true }}">
<div class="po-stage" style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; padding: 32px 20px 56px; box-sizing: border-box; text-align: center">
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; display: flex; align-items: center; justify-content: center">
<div class="po-beam" style="position: absolute; width: 180px; height: 170%; background: {{beam}}"></div>
</div>
<div class="po-card" aria-hidden="true" style="position: relative; width: 150px; height: 104px; box-sizing: border-box; padding: 16px 18px; border-radius: 16px; background: {{glassBg}}; border: 1px solid {{glassBorder}}; box-shadow: {{glassShadow}}; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); display: flex; gap: 14px; align-items: flex-start">
<svg width="30" height="38" viewBox="0 0 30 38" style="flex: none"><path d="M2 4 Q2 2 4 2 L20 2 L28 10 L28 34 Q28 36 26 36 L4 36 Q2 36 2 34 Z" fill="none" stroke="{{green1}}" stroke-width="2" stroke-linejoin="round"></path><path d="M20 2 L20 10 L28 10" fill="none" stroke="{{green1}}" stroke-width="2" stroke-linejoin="round"></path></svg>
<div style="flex: 1; display: flex; flex-direction: column; gap: 9px; padding-top: 2px">
<div class="po-sk" style="height: 7px; width: 100%; border-radius: 4px; background: {{green1}}; opacity: .85; animation-delay: .45s"></div>
<div class="po-sk" style="height: 7px; width: 72%; border-radius: 4px; background: {{skeleton}}; animation-delay: .55s"></div>
<div class="po-sk" style="height: 7px; width: 86%; border-radius: 4px; background: {{skeleton}}; animation-delay: .65s"></div>
<div class="po-sk" style="height: 7px; width: 48%; border-radius: 4px; background: {{gold}}; animation-delay: .75s"></div>
</div>
<div class="po-stamp" style="position: absolute; bottom: -12px; inset-inline-end: -12px; width: 34px; height: 34px; border-radius: 50%; background: {{gold}}; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(140,106,34,.35)">
<svg width="16" height="16" viewBox="0 0 16 16"><path d="M3.5 8.5 L6.5 11.2 L12.5 5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</div>
<svg width="40" height="40" viewBox="-20 -20 40 40" style="position: absolute; top: -18px; inset-inline-start: -18px; overflow: visible"><path class="po-spark" style="animation-delay: 3.1s" d="M0 -16 L2.4 -2.4 L16 0 L2.4 2.4 L0 16 L-2.4 2.4 L-16 0 L-2.4 -2.4 Z" fill="{{sparkle}}"></path></svg>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: 100%">
<h1 class="po-title" style="margin: 0; padding: 0 8px; font-family: {{titleFont}}; font-size: {{titleSize}}; font-weight: {{titleWeight}}; line-height: 1.15; background-image: {{shine}}">{{title}}</h1>
<sc-if value="{{isEn}}" hint-placeholder-val="{{ true }}">
<p aria-label="Rosemary Software Solutions" style="margin: 0; font-size: clamp(10px, 1.1vw, 13px); font-weight: 500; letter-spacing: .38em; color: {{goldText}}"><sc-for list="{{letters}}" as="l" hint-placeholder-count="27"><span class="po-ch" aria-hidden="true" style="animation-delay: {{l.delay}}">{{l.ch}}</span></sc-for></p>
</sc-if>
<sc-if value="{{isAr}}" hint-placeholder-val="{{ false }}">
<p class="po-fade" style="margin: 0; font-size: 15px; font-weight: 500; color: {{goldText}}; animation-delay: .9s">روزميري للحلول البرمجية</p>
</sc-if>
</div>
<div class="po-pipe" role="list" aria-label="{{pipeLabel}}">
<div class="po-track" aria-hidden="true" style="background: {{track}}"><div class="po-fill" style="background: {{fillLine}}"></div></div>
<sc-for list="{{stages}}" as="s" hint-placeholder-count="6">
<div class="po-node" role="listitem" style="animation-delay: {{s.inDelay}}">
<div class="po-dot" style="background: {{glassBg}}; border: 1.5px solid {{glassBorder}}; color: {{muted}}">
<span>{{s.num}}</span>
<div class="po-ring" style="border: 2px solid {{green1}}; animation-delay: {{s.onDelay}}"></div>
<div class="po-on" style="background: {{green1}}; animation-delay: {{s.onDelay}}">
<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path class="po-check" style="animation-delay: {{s.checkDelay}}" pathLength="100" d="M4 9.5 L7.5 12.5 L14 6" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</div>
</div>
<span class="po-label" style="color: {{ink}}">{{s.label}}</span>
</div>
</sc-for>
</div>
<p class="po-fade" style="margin: 0; max-width: 520px; font-size: clamp(14px, 1.4vw, 17px); line-height: 1.6; color: {{muted}}; animation-delay: 2.7s">{{tagline}}</p>
<div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; gap: 10px">
<span class="po-fade" style="font-size: 12px; letter-spacing: .04em; color: {{muted}}; animation-delay: .3s">{{loading}}</span>
<div aria-hidden="true" style="width: 100%; height: 3px; background: {{track}}"><div class="po-progress" style="height: 3px; background: {{fillLine}}"></div></div>
</div>
</div>
</sc-if>
<sc-if value="{{showReplay}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{replay}}" style="position: absolute; top: 16px; inset-inline-end: 16px; min-height: 44px; padding: 0 18px; border-radius: 22px; border: 1px solid {{gold}}; background: transparent; color: {{goldText}}; font-family: inherit; font-size: 14px; cursor: pointer">{{replayLabel}}</button>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"language":{"editor":"enum","options":["en","ar"],"default":"en","section":"Content"},"siteTheme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Display"},"backdrop":{"editor":"enum","options":["none","light","dark"],"default":"none","section":"Display"},"gold":{"editor":"color","default":"#C9A24A","options":["#C9A24A","#D4AF37","#B8893A","#E6C877"],"section":"Colors"},"loop":{"editor":"boolean","default":true,"section":"Preview"},"showReplay":{"editor":"boolean","default":true,"section":"Preview"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { show: true };
  }
  componentDidMount() {
    this.timer = setInterval(() => {
      if (this.props.loop ?? true) this.restart();
    }, 6500);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
    clearTimeout(this.t2);
  }
  restart() {
    this.setState({ show: false });
    clearTimeout(this.t2);
    this.t2 = setTimeout(() => this.setState({ show: true }), 60);
  }
  renderVals() {
    const ar = (this.props.language ?? 'en') === 'ar';
    const dark = (this.props.siteTheme ?? 'light') === 'dark';
    const gold = this.props.gold ?? '#C9A24A';
    const ink = dark ? '#F5F1E6' : '#0E3B2E';
    const bd = this.props.backdrop ?? 'none';
    const glow = dark ? 'rgba(255,244,214,.34)' : 'rgba(226,190,104,.38)';
    const green1 = dark ? '#5FBF85' : '#1F7A50';
    const labels = ar
      ? ['الطلب', 'المستودع', 'الموافقات', 'المشتريات', 'الاستلام', 'الحسابات']
      : ['Request', 'Warehouse', 'Approvals', 'Purchasing', 'Receipt', 'Accounts'];
    const digits = ar ? ['١', '٢', '٣', '٤', '٥', '٦'] : ['1', '2', '3', '4', '5', '6'];
    const stages = labels.map((label, i) => ({
      label,
      num: digits[i],
      inDelay: (0.6 + i * 0.07).toFixed(2) + 's',
      onDelay: (1.0 + i * 0.33).toFixed(2) + 's',
      checkDelay: (1.18 + i * 0.33).toFixed(2) + 's'
    }));
    const letters = 'ROSEMARY SOFTWARE SOLUTIONS'.split('').map((c, i) => ({
      ch: c === ' ' ? ' ' : c,
      delay: (0.9 + i * 0.025).toFixed(3) + 's'
    }));
    return {
      show: this.state.show,
      isEn: !ar,
      isAr: ar,
      dir: ar ? 'rtl' : 'ltr',
      rootClass: ar ? 'po-rtl' : 'po-ltr',
      bodyFont: ar ? "'IBM Plex Sans Arabic', system-ui, sans-serif" : "'Inter', system-ui, sans-serif",
      titleFont: ar ? "'IBM Plex Sans Arabic', system-ui, sans-serif" : "'Cormorant Garamond', Georgia, serif",
      titleWeight: ar ? '700' : '600',
      titleSize: ar ? 'clamp(28px, 4.6vw, 52px)' : 'clamp(32px, 5.4vw, 64px)',
      title: ar ? 'نظام تتبع أوامر الشراء' : 'Purchase Order Tracking',
      tagline: ar ? 'من الطلب حتى الإقفال المحاسبي — كل أمر، في كل مرحلة.' : 'From request to final accounting — every order, at every stage.',
      loading: ar ? 'جاري تجهيز مساحة العمل…' : 'Preparing your workspace…',
      pipeLabel: ar ? 'مراحل أمر الشراء' : 'Purchase order stages',
      replayLabel: ar ? 'إعادة التشغيل' : 'Replay',
      stages,
      letters,
      gold,
      ink,
      green1,
      fillLine: 'linear-gradient(90deg, ' + green1 + ', ' + gold + ')',
      track: dark ? 'rgba(255,255,255,.12)' : 'rgba(14,59,46,.10)',
      skeleton: dark ? 'rgba(255,255,255,.16)' : 'rgba(14,59,46,.12)',
      glassBg: dark ? 'rgba(255,255,255,.07)' : 'rgba(255,255,255,.6)',
      glassBorder: dark ? 'rgba(255,255,255,.18)' : 'rgba(14,59,46,.14)',
      glassShadow: dark ? '0 12px 32px rgba(0,0,0,.25)' : '0 12px 32px rgba(14,59,46,.12), inset 0 1px 0 rgba(255,255,255,.8)',
      goldText: dark ? '#D9BB6A' : '#8C6A22',
      muted: dark ? '#CFC8B6' : '#3F5249',
      sparkle: dark ? '#FFF4D6' : '#E2B85A',
      beam: 'linear-gradient(90deg, rgba(255,255,255,0) 0%, ' + glow + ' 50%, rgba(255,255,255,0) 100%)',
      shine: 'linear-gradient(100deg, ' + ink + ' 0%, ' + ink + ' 40%, ' + gold + ' 47%, #FFF1C9 50%, ' + gold + ' 53%, ' + ink + ' 60%, ' + ink + ' 100%)',
      backdrop: bd === 'light' ? '#F7F5EF' : bd === 'dark' ? '#0B3327' : 'transparent',
      showReplay: this.props.showReplay ?? true,
      replay: () => this.restart()
    };
  }
}
</script>
</body>
</html>
